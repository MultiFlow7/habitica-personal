name: Personal release
on:
  workflow_dispatch:
  push:
    tags: ['personal-v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Build and run shared game tests
        run: docker build --build-arg REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t "habitica-personal:$GITHUB_SHA" .
      - name: Start isolated production fixture
        run: |
          python3 deploy/configure.py --output deploy/config.json
          sudo chown 1000:1000 deploy/config.json
          echo "HABITICA_IMAGE=habitica-personal:$GITHUB_SHA" > deploy/.env
          docker compose -f deploy/compose.yml up -d --wait --wait-timeout 240
      - name: Verify application and database
        run: docker compose -f deploy/compose.yml exec -T app node deploy/smoke.mjs
      - name: Export fixed release artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          docker save "habitica-personal:$GITHUB_SHA" | gzip > release/habitica-image.tar.gz
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          cp deploy/compose.yml deploy/manage.sh deploy/configure.py config.json.example release/
          cd release && sha256sum habitica-image.tar.gz REVISION compose.yml manage.sh configure.py config.json.example > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: habitica-release-${{ github.sha }}
          path: release/
          retention-days: 7
          compression-level: 0
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 100
      - name: Stop fixture
        if: always()
        run: docker compose -f deploy/compose.yml down -v
