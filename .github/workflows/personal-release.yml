name: Personal release
on:
  workflow_dispatch:
  push:
    tags: ['personal-v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0
      - name: Check publication privacy
        run: |
          python3 scripts/test-privacy-check.py
          python3 scripts/privacy-check.py --history
      - name: Test agent CLI transport and privacy
        run: python3 cli/test_cli.py
      - name: Build and run shared game tests
        run: docker build --build-arg REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t "habitica-personal:$GITHUB_SHA" .
      - name: Start isolated production fixture
        run: |
          python3 deploy/configure.py --output deploy/config.json
          sudo chown 1000:1000 deploy/config.json
          echo "HABITICA_IMAGE=habitica-personal:$GITHUB_SHA" > deploy/.env
          docker compose -f deploy/compose.yml up -d --wait --wait-timeout 240
      - name: Verify application and database
        run: |
          docker compose -f deploy/compose.yml exec -T app node deploy/check.mjs
          docker compose -f deploy/compose.yml exec -T -e ALLOW_ISOLATED_SMOKE=true app node deploy/smoke.mjs
      - name: Verify agent CLI against isolated API
        run: python3 cli/test_live.py
      - name: Verify browser under application subpath
        run: |
          npm install --prefix work/browser --no-package-lock --no-audit --no-fund playwright@1.55.0
          ./work/browser/node_modules/.bin/playwright install --with-deps chromium
          node deploy/browser-check.mjs
      - name: Export fixed release artifact
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint sh "habitica-personal:$GITHUB_SHA" -c \
            'test ! -e /app/config.json && test ! -e /app/.habitica-server.json && test ! -e /app/.git && test ! -e /app/backups && test ! -e /data/db'
          mkdir -p release
          docker save "habitica-personal:$GITHUB_SHA" | gzip > release/habitica-image.tar.gz
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          cp deploy/compose.yml deploy/manage.sh deploy/configure.py config.json.example release/
          cd release && sha256sum habitica-image.tar.gz REVISION compose.yml manage.sh configure.py config.json.example > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: habitica-release-${{ github.sha }}
          path: release/
          retention-days: 7
          compression-level: 0
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 100
      - name: Stop fixture
        if: always()
        run: docker compose -f deploy/compose.yml down -v
